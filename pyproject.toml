[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depthwizard"
version = "0.1.0"
description = "Building height estimation from monocular satellite imagery using shadow physics (SIH 2026, PS SIH26175)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core dependencies needed to run Phase 0 (config, logging, synthetic fixture).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python>=4.8",
    "rasterio>=1.3",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Phase 3 (the relative-height baseline) needs torch and timm; transformers
# provides its pretrained fallback (Depth Anything V2-Small). Kept as an extra
# so that a plain `pip install -e .` stays small; install with
# `pip install -e ".[ml]"`. For the GPU, install the CUDA build of torch first
# from the PyTorch index (e.g. cu124) so pip does not pull a CPU wheel.
ml = ["torch>=2.1", "timm>=0.9.16", "transformers>=4.45"]

# Phase 8 demo API (python -m depthwizard.demo serve). Demo-grade only:
# `pip install -e ".[demo]"`. The demo CLI's synthetic run does not need it.
demo = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

# Standalone GDAL bindings. See the note in requirements.txt - prefer conda.
gdal = ["GDAL>=3.6"]

dev = ["pytest>=7.4", "httpx>=0.27"]

[project.scripts]
depthwizard-make-fixture = "depthwizard.ingest.synthetic:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depthwizard = ["py.typed"]

[tool.pytest.ini_options]
# Lets `pytest` work straight from a clone without `pip install -e .` first.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: builds a full pretrained-architecture backbone; deselect with -m 'not slow'",
    "real_data: reads the local DFC2019 download; opt-in via DEPTHWIZARD_REAL_DATA=1",
]
filterwarnings = [
    "error",
    # Raised by fixtures that deliberately write ungeoreferenced rasters to
    # prove DepthWizard refuses to treat them as georeferenced.
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    # rasterio 1.4.x calls affine's deprecated `*` operator from inside its own
    # windows.transform() during a boundless read, which Phase 3's paired tile
    # reader relies on. Third-party call path, not ours; scoped to that one
    # message so any other pending deprecation still fails the suite.
    "ignore:Use `@` matmul instead of:PendingDeprecationWarning",
]
